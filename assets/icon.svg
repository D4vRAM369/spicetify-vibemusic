<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="50%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#1db954" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1db954" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3be477"/>
      <stop offset="55%" stop-color="#1ed760"/>
      <stop offset="100%" stop-color="#149440"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6cc"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#3e3e3e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1db954" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Card Background -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#glowGrad)"/>
  <rect x="22" y="22" width="468" height="468" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Vinyl / Soundwave Rings -->
  <circle cx="242" cy="316" r="118" fill="none" stroke="#1db954" stroke-opacity="0.10" stroke-width="2.5" stroke-dasharray="18 12"/>
  <circle cx="242" cy="316" r="152" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Main Musical Note (Emerald Gradient) -->
  <g filter="url(#emeraldGlow)">
    <path d="M276 112v188.5c-14.2-10.4-32.2-16.5-52-16.5-46.4 0-84 35.8-84 80s37.6 80 84 80c46.4 0 84-35.8 84-80V196h76c11 0 20-9 20-20v-44c0-11-9-20-20-20H276z" fill="url(#emeraldGrad)"/>
    <circle cx="224" cy="364" r="32" fill="#121212" fill-opacity="0.28"/>
  </g>

  <!-- Large AI Sparkle (Top Left, Golden) -->
  <path d="M138 78c6.2 26.8 19.4 40 46.2 46.2-26.8 6.2-40 19.4-46.2 46.2-6.2-26.8-19.4-40-46.2-46.2 26.8-6.2 40-19.4 46.2-46.2z" fill="url(#sparkleGrad)" filter="url(#softShadow)"/>

  <!-- Medium AI Sparkle (Right, Emerald-White) -->
  <path d="M398 242c4.4 18.8 13.6 28 32.4 32.4-18.8 4.4-28 13.6-32.4 32.4-4.4-18.8-13.6-28-32.4-32.4 18.8-4.4 28-13.6 32.4-32.4z" fill="url(#sparkleGrad)"/>

  <!-- Small Star Dot Accents -->
  <circle cx="212" cy="106" r="6" fill="#3be477" opacity="0.85"/>
  <circle cx="382" cy="348" r="5" fill="#ffd166" opacity="0.75"/>
  <circle cx="110" cy="212" r="5" fill="#3be477" opacity="0.65"/>
</svg>
